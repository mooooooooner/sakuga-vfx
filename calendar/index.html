<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Calendar</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(680px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; min-height: 360px; padding: 68px 0 20px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 9px; }
  .preset { padding: 7px 14px; border: 2.4px solid #1d1a4a; border-radius: 11px; background: #fff; color: #1d1a4a; font: 800 13px/1.2 inherit; cursor: pointer; box-shadow: 3px 3.5px 0 #b8b3ff; transition: transform 0.08s ease; }
  .preset:hover { background: #f2f1ff; }
  .preset:active { transform: translate(2px, 2px); box-shadow: 1px 1.5px 0 #b8b3ff; }
  .preset.hot { background: #ff5fa8; color: #fff; box-shadow: 3px 3.5px 0 #1d1a4a; }
  .preset.pri { background: #8f8df7; color: #fff; box-shadow: 3px 3.5px 0 #1d1a4a; }
  .hint, .said { margin: 0 4px; color: var(--mute); }
  .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; }
  .embed h1, .embed .sub, .embed .hint { display: none; }
  .embed main { padding: 0; }
  .embed .stage { padding: 48px 0 12px; min-height: 0; gap: 16px; }
</style>
</head>
<body>
<main>
  <h1>Calendar</h1>
  <p class="sub">Inline cel-shaded manga calendar with seamless Day, Month, and Year zoom-cut views.</p>
  <div class="stage">
    <sakuga-calendar id="el" value="2026-04-15" label="Production schedule"></sakuga-calendar>
    <div class="controls">
      <button id="btn-day" class="preset" type="button">Day View</button>
      <button id="btn-month" class="preset" type="button">Month View</button>
      <button id="btn-year" class="preset pri" type="button">Year View</button>
      <button id="btn-today" class="preset hot" type="button">Today</button>
    </div>
  </div>
  <p class="hint">Click the month/year header to zoom out, use the view pill strip, pick any day for <code>change</code>, or navigate with arrow keys, <code>PageUp</code>/<code>PageDown</code>, and <code>Backspace</code>.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="calendar.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
const el = document.getElementById('el');

el.events = [
  { date: '2026-04-06', title: 'Storyboard Lock', tone: 'pri' },
  { date: '2026-04-15', title: 'Key Animation Review', tone: 'acc' },
  { date: '2026-04-15', title: 'Sakuga Reel Export', tone: 'pri' },
  { date: '2026-04-22', title: 'Color Script Lock', tone: 'green' },
  { date: '2026-05-04', title: 'Compositing Pass', tone: 'amber' },
  { date: '2026-05-16', title: 'Episode Premiere', tone: 'acc' },
];

document.getElementById('btn-day').addEventListener('click', () => el.setView('day'));
document.getElementById('btn-month').addEventListener('click', () => el.setView('month'));
document.getElementById('btn-year').addEventListener('click', () => el.setView('year'));
document.getElementById('btn-today').addEventListener('click', () => el.today());

el.addEventListener('change', (e) => {
  const { value, events } = e.detail;
  const note = events.length ? ` — ${events.map((x) => x.title).join(', ')}` : '';
  say(`change: ${value}${note}`);
});
el.addEventListener('sakuga:view-change', (e) => {
  say(`view: ${e.detail.prev} → ${e.detail.view} (${e.detail.year}-${String(e.detail.month).padStart(2, '0')})`);
});
el.addEventListener('sakuga:navigate', (e) => {
  say(`navigate: ${e.detail.year}-${String(e.detail.month).padStart(2, '0')} (${e.detail.view})`);
});
</script>
</body>
</html>
