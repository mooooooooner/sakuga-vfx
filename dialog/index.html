<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Dialog</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(680px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px; min-height: 240px; padding: 36px 0; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Dialog</h1>
  <p class="sub">An anime slam-in manga modal.</p>
  <div class="stage">
  <button id="open-btn" type="button" style="padding:10px 20px;border:2.5px solid #1d1a4a;border-radius:12px;background:#fff;font:700 15px/1.2 inherit;cursor:pointer;box-shadow:3px 4px 0 #c9c4e6">Open dialog</button>
  <button id="open-danger" type="button" style="padding:10px 20px;border:2.5px solid #1d1a4a;border-radius:12px;background:#ff5fa8;color:#fff;font:700 15px/1.2 inherit;cursor:pointer;box-shadow:3px 4px 0 #c9c4e6">Open danger dialog</button>
  <sakuga-dialog id="el" heading="Confirm Action" subtitle="This modal slams in on springs.">
    <p style="margin:0">Press Escape, click the backdrop, or click Close to dismiss.</p>
    <div slot="footer" style="display:flex;justify-content:flex-end;gap:8px">
      <button id="close-btn" type="button" style="padding:8px 16px;border:2px solid #1d1a4a;border-radius:10px;background:#fff;font:700 14px/1.2 inherit;cursor:pointer">Close</button>
    </div>
  </sakuga-dialog>
  </div>
  <p class="hint">Open the standard or danger variant, then dismiss with Escape or the Close button.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="dialog.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
const el = document.getElementById('el');
document.getElementById('open-btn').addEventListener('click', () => { el.removeAttribute('danger'); el.setAttribute('heading', 'Confirm Action'); el.open = true; say('opened'); });
document.getElementById('open-danger').addEventListener('click', () => { el.setAttribute('danger', ''); el.setAttribute('heading', 'Danger Zone'); el.open = true; say('opened (danger)'); });
document.getElementById('close-btn').addEventListener('click', () => { el.open = false; });
el.addEventListener('close', () => say('closed'));
</script>
</body>
</html>
