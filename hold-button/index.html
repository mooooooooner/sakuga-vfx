<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Hold Button</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(680px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 56px 28px; min-height: 260px; padding: 96px 0 48px; }
  @media (max-width: 520px) { .stage { gap: 34px 20px; padding: 72px 0 36px; } }
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .demo-btn { padding: 8px 14px; border: 2.5px solid #1d1a4a; border-radius: 12px; background: #fff; color: #1d1a4a; font: 700 13.5px/1.2 inherit; cursor: pointer; box-shadow: 3px 4px 0 #b8b3ff; }
  .demo-btn:active { transform: translate(2px, 2px); box-shadow: 1px 2px 0 #b8b3ff; }
  .demo-btn.pri { background: #8f8df7; color: #fff; box-shadow: 3px 4px 0 #1d1a4a; }
  .demo-btn.hot { background: #ff5fa8; color: #fff; box-shadow: 3px 4px 0 #1d1a4a; }
  .hint, .said { margin: 0 4px; color: var(--mute); }
  .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; }
  .embed h1, .embed .sub, .embed .hint, .embed .controls { display: none; }
  .embed main { padding: 0; }
  .embed .stage { padding: 80px 0 32px; min-height: 0; }
</style>
</head>
<body>
<main>
  <h1>Hold Button</h1>
  <p class="sub">An anime charge-up hold-to-confirm button with cel-shaded meter, overdrive tension, and impact detonation.</p>
  <div class="stage">
    <sakuga-hold-button id="el" duration="1200" hold-label="Charging..." done-label="Launched!">Hold to Launch</sakuga-hold-button>
    <sakuga-hold-button id="el-danger" variant="danger" duration="1000" hold-label="Purging..." done-label="Purged!">Hold to Purge</sakuga-hold-button>
    <sakuga-hold-button id="el-sec" variant="secondary" duration="700" hold-label="Locking..." done-label="Locked!">Hold to Lock</sakuga-hold-button>
  </div>
  <div class="controls">
    <button id="btn-demo" class="demo-btn pri" type="button">Demo Full Charge</button>
    <button id="btn-instant" class="demo-btn hot" type="button">Instant Detonate</button>
    <button id="btn-reset" class="demo-btn" type="button">Reset All</button>
  </div>
  <p class="hint">Press and hold any button (or focus and hold <code>Space</code> / <code>Enter</code>) to charge to 100%. Release early to feel the spring abort.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="hold-button.js"></script>
<script>
// This page's own wiring. The component is all in hold-button.js.
// ?embed=1 hides the heading, controls, and hint.
const Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
const els = [
  ['Launch', document.getElementById('el')],
  ['Purge', document.getElementById('el-danger')],
  ['Lock', document.getElementById('el-sec')],
];

for (const [name, el] of els) {
  el.addEventListener('sakuga:start', (e) => say(`${name}: sakuga:start (${e.detail.duration}ms)`));
  el.addEventListener('sakuga:progress', (e) => {
    const pct = Math.round(e.detail.progress * 100);
    if (pct % 10 === 0 || pct >= 99) say(`${name}: charging ${pct}%`);
  });
  el.addEventListener('sakuga:cancel', (e) => say(`${name}: sakuga:cancel at ${Math.round(e.detail.progress * 100)}%`));
  el.addEventListener('sakuga:confirm', (e) => say(`${name}: sakuga:confirm! (${e.detail.variant}, ${e.detail.duration}ms)`));
}

document.getElementById('btn-demo').addEventListener('click', () => els[0][1].trigger());
document.getElementById('btn-instant').addEventListener('click', () => els[0][1].trigger(true));
document.getElementById('btn-reset').addEventListener('click', () => {
  for (const [, el] of els) el.reset();
  say('reset');
});
</script>
</body>
</html>
