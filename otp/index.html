<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga OTP</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(680px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 52px; min-height: 320px; padding: 92px 0 36px; }
  .group { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%; }
  .lbl { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .acts { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  .act {
    padding: 8px 16px; border: 2.5px solid #1d1a4a; border-radius: 11px;
    background: #ffffff; color: #1d1a4a; font: 700 13.5px/1.2 inherit;
    box-shadow: 3px 4px 0 #b8b3ff; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .act.pri { background: #8f8df7; color: #ffffff; }
  .act.acc { background: #ff5fa8; color: #ffffff; }
  .act:active { transform: translate(1px, 2px); }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; } .embed .stage { padding: 48px 0 24px; min-height: 220px; }
</style>
</head>
<body>
<main>
  <h1>OTP</h1>
  <p class="sub">Verification-code &amp; PIN tiles with domino paste wave, completion burst, and error recoil.</p>
  <div class="stage">
    <div class="group">
      <sakuga-otp id="el" length="6" separator="3" label="Verification code"></sakuga-otp>
    </div>
    <div class="acts">
      <button id="btn-paste" class="act pri" type="button">Paste 482916</button>
      <button id="btn-error" class="act acc" type="button">Trigger Error</button>
      <button id="btn-clear" class="act" type="button">Clear</button>
    </div>
    <div class="group">
      <p class="lbl">4-Digit Masked PIN</p>
      <sakuga-otp id="el-pin" length="4" masked label="Security PIN"></sakuga-otp>
    </div>
  </div>
  <p class="hint">Type digits, press Backspace or Arrow keys, paste a code, or trigger the demo actions above.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="otp.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
const el = document.getElementById('el');
const pin = document.getElementById('el-pin');

el.addEventListener('input', (e) => say('otp input: "' + e.detail.value + '"'));
el.addEventListener('sakuga:complete', (e) => say('otp complete: ' + e.detail.value));
pin.addEventListener('input', (e) => say('pin input: ' + '●'.repeat(e.detail.value.length) + ' (' + e.detail.value + ')'));
pin.addEventListener('sakuga:complete', (e) => say('pin complete: ' + e.detail.value));

document.getElementById('btn-paste').addEventListener('click', () => el.fill('482916'));
document.getElementById('btn-error').addEventListener('click', () => { el.error('Invalid code'); say('otp error: Invalid code'); });
document.getElementById('btn-clear').addEventListener('click', () => { el.clear(); say('cleared'); });
</script>
</body>
</html>
